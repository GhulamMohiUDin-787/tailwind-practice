<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./dist/output.css" />
  <script>
    if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark");
    }
  </script>
</head>
<body class="bg-gray-100 p-6 text-black transition-colors dark:bg-black dark:text-white">
  <div class="mx-auto flex max-w-sm items-center gap-x-4 rounded-xl bg-white p-6 shadow-lg outline outline-black/5 dark:bg-slate-800 dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
    <img class="size-16 shrink-0 rounded-full object-cover" src=" image 1.png" alt="ChitChat Logo" />
    <div>
    <ul class="hidden items-center gap-6 laptop:flex">
      <li><a href="#home" class="hover:underline">Home</a></li>
      <li><a href="#projects" class="hover:underline">Projects</a></li>
      <li><a href="#skills" class="hover:underline">Skills</a></li>
      <li><a href="#contact" class="hover:underline">Contact</a></li>
    </ul>
    <div class="text-xl font-medium text-black dark:text-white"></div>
    <p class="text-gray-500 dark:text-gray-400">You have a new message!</p>
    </div>
  </div>
  <button class="m-4 rounded-md bg-sky-400 p-5 hover:bg-sky-900">Hover Effect</button>
  <button id="theme-toggle" class="mb-6 rounded border hover:bg-slate-200 border-black px-4 py-2 dark:border-white">
    Dark / Light
  </button>
  <script>
    document.getElementById("theme-toggle").onclick = () => {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
    };
  </script>
</body>
</html>
